<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>OGame Accountstatistik</title>
    <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="account.css">

<body class="auth-protected">
    <div id="app">
        <header class="hero">
            <div class="hero-inner">
                <p class="eyebrow">Private Account Intelligence</p>
                <h1 id="accountTitle">Accountstatistik</h1>
                <p id="accountSubtitle">Daten werden geladen …</p>
            </div>
        </header>
        <nav class="toolbar">
            <div class="range-tabs"><a class="nav-link" href="index.html">Allianzstatistik</a><a class="nav-link" href="messages.html">Nachrichten</a>

            </div><button type="button" data-auth-logout>Abmelden</button>

        <main id="accountMain"></main>
        <section id="dashboardView" class="protected-dashboard" hidden><iframe id="dashboardFrame"
                title="Privates OGame Dashboard" loading="lazy"></iframe></section>
        <footer id="accountFooter"></footer>
    </div>

  <script src="supabase-config.js"></script>

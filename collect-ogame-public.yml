# OGame Stats v8.7

## Imperiumsübersicht
- LF-Forschungs-Gesamtbonus hat jetzt einen eigenen gültigen HTML-Container.
- Sichtbar in der Zeile „PLANETEN IM VORDERGRUND“.
- Mondansicht blendet diesen Forschungsbonus aus.
- Iframe meldet seine Höhe nach jeder DOM-Änderung mehrfach neu.
- MutationObserver und ResizeObserver erkennen auch das Aufklappen langer Forschungsbereiche.
- Im Iframe ist vertikales Scrollen deaktiviert; nur die äußere Seite soll scrollen.

## Spieler-Historie
- Lädt nicht mehr die veraltete `data.json`, sondern aktuelle Supabase-Daten.
- Dadurch erscheint auch der heutige Tagesstand, sofern er in
  `ogame_player_snapshots` vorhanden ist.
- Beim Hover über einen Wert erscheint die Differenz zum Vortag.
- Positiv: grün mit `+`.
- Negativ: rot mit `-`.
- Bei Rängen gilt eine kleinere Rangnummer als positive Verbesserung.

# Imperiumsübersicht v8.5

- Planetenkarten zeigen nur Metall, Kristall und Deuterium.
- Mondkarten zeigen Felder belegt / gesamt.
- Lebensform-Forschungsgruppen sind standardmäßig eingeklappt; nur die erkannte aktive Lebensform ist offen.
- Lebensformerkennung nutzt LF-Gebäude und bei alten Snapshots ersatzweise den dominanten Forschungs-Prefix.
- Dropdowns sind kürzer und besser lesbar.
- Iframe-Höhe wächst nicht mehr in eine leere Scrollfläche.
- Zusätzliche bekannte LF-Boni werden angezeigt; unbekannte Formeln werden deutlich bezeichnet.

Für korrekte Mondfelder und Mondanlagen muss zusätzlich Companion v7.13 installiert und danach ein neuer Snapshot erstellt werden.
